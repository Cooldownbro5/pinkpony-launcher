<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pink Pony</title>
<style>
  /* Self-contained on purpose. This window has to be able to draw before the
     app's own stylesheet, fonts or anything else has loaded - it is what the
     user looks at while all of that is still being replaced on disk. */
  :root{
    --void:#08060C; --panel:#100D16; --line:#221C2E;
    --pink:#FF3FA8; --pinkhi:#FF7BC8; --bone:#F4F1F7; --ash:#9C95AA;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--void); color:var(--bone);
    font-family:'Space Grotesk',system-ui,sans-serif;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:18px; user-select:none; cursor:default;
    border:1px solid var(--line); border-radius:14px; overflow:hidden;
    /* The whole window drags, since it has no title bar to grab. */
    -webkit-app-region:drag;
  }
  body::before{
    content:""; position:absolute; inset:-40% -20% auto -20%; height:70%;
    background:radial-gradient(60% 60% at 50% 40%,#FF3FA828,transparent 70%);
    pointer-events:none;
  }
  img{width:54px; height:auto; image-rendering:auto; position:relative}
  .name{
    font-size:13px; font-weight:700; letter-spacing:4px; text-transform:uppercase;
    position:relative;
  }
  .msg{
    font-family:'JetBrains Mono',ui-monospace,monospace;
    font-size:11.5px; letter-spacing:1.4px; text-transform:uppercase;
    color:var(--ash); min-height:16px; position:relative;
  }
  .track{
    position:relative; width:236px; height:4px; border-radius:999px;
    background:#ffffff12; overflow:hidden;
  }
  .bar{
    display:block; height:100%; width:0%; border-radius:999px;
    background:linear-gradient(90deg,var(--pinkhi),var(--pink));
    transition:width .25s ease;
  }
  /* Before a percentage exists there is nothing honest to fill a bar with, so
     it sweeps instead of sitting at some invented number. */
  .track.idle .bar{
    width:38%; animation:sweep 1.15s ease-in-out infinite;
  }
  @keyframes sweep{
    0%{transform:translateX(-100%)} 100%{transform:translateX(268%)}
  }
</style>
</head>
<body>
  <img src="img/logo.png" alt="">
  <div class="name">Pink Pony</div>
  <div class="msg" id="msg">Checking for updates</div>
  <span class="track idle" id="track"><i class="bar" id="bar"></i></span>

<script>
  const msg = document.getElementById('msg');
  const bar = document.getElementById('bar');
  const track = document.getElementById('track');

  window.pp?.onBoot?.((s) => {
    if (s.text) msg.textContent = s.text;
    if (typeof s.percent === 'number') {
      track.classList.remove('idle');
      bar.style.width = Math.max(2, Math.min(100, Math.round(s.percent))) + '%';
    } else {
      track.classList.add('idle');
    }
  });
</script>
</body>
</html>
